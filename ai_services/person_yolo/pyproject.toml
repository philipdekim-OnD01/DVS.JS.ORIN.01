[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nrv-person-yolo"
version = "0.1.0"
description = "Read-only DVS snapshot preview to YOLO person smoke test (not RAW2 decoding)"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "Pillow==11.3.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
yolo = ["ultralytics==8.3.228", "torch==2.9.0", "torchvision==0.24.0"]

[project.scripts]
person-yolo = "person_yolo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
